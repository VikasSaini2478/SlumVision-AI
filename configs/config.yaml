# ============================================================
# SlumNet Configuration
# ============================================================

project:
  name: "SlumNet"
  seed: 42
  device: "cuda"  # "cuda" or "cpu"

data:
  images_dir: "dataset/images"
  masks_dir: "dataset/masks"
  patch_size: 256
  stride: 128            # overlap for patch extraction (< patch_size means overlapping patches)
  val_split: 0.15
  test_split: 0.10
  num_classes: 2          # 2 = binary (slum / non-slum). Set 7 for multi-class scheme.
  class_names: ["non_slum", "slum"]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  cloud_mask: false
  balance_classes: true

augmentation:
  horizontal_flip_p: 0.5
  vertical_flip_p: 0.5
  rotate_p: 0.5
  brightness_contrast_p: 0.4
  clahe_p: 0.3
  gaussian_blur_p: 0.2
  gaussian_noise_p: 0.2
  elastic_transform_p: 0.2
  random_crop_p: 0.3
  random_shadow_p: 0.2
  grid_distortion_p: 0.2

model:
  backbone: "resnet50"           # options: resnet50, efficientnet_b4, convnext_tiny (all via timm)
  backbone_pretrained: true
  transformer: "swin_tiny"       # options: swin_tiny, segformer_b0, vit_small
  use_transformer: true
  attention: "cbam"              # options: cbam, channel, spatial, mhsa
  fusion: "bifpn"                 # options: fpn, bifpn, cross_attention
  fusion_channels: 256
  use_moe: true
  moe:
    num_experts: 5
    expert_names:
      - "dense_roof_pattern"
      - "informal_road_network"
      - "building_density"
      - "vegetation_separation"
      - "open_space"
    top_k: 2                      # sparse gating: number of experts activated per token
  decoder:
    use_attention_gates: true
    use_residual_blocks: true
    decoder_channels: [256, 128, 64, 32]

loss:
  use_dice: true
  use_focal: true
  use_ce: true
  use_boundary: true
  weights:
    dice: 1.0
    focal: 1.0
    ce: 0.5
    boundary: 0.5
  class_weights: null   # e.g. [1.0, 3.0] to upweight slum class; null = auto-computed from data

training:
  epochs: 1
  batch_size: 2
  num_workers: 0
  lr: 0.0003
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_epochs: 5
  early_stopping_patience: 15
  amp: true                       # mixed precision
  grad_clip: 1.0
  checkpoint_dir: "checkpoints"
  log_dir: "outputs/logs"
  save_best_only: true

evaluation:
  metrics: ["miou", "dice", "pixel_accuracy", "precision", "recall", "f1", "boundary_iou"]
  threshold: 0.5

explainability:
  gradcam_target_layer: "backbone.layer4"
  save_heatmaps: true

gis:
  output_formats: ["geotiff", "shapefile", "geojson"]
  min_cluster_pixels: 25
  crs: "EPSG:4326"

api:
  host: "0.0.0.0"
  port: 8000

dashboard:
  title: "SlumNet — AI Slum Detection & Mapping"
  max_upload_mb: 50
