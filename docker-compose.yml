version: "3.9"

services:
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./dataset:/app/dataset
      - ./outputs:/app/outputs
    environment:
      - SLUMNET_CONFIG=configs/config.yaml
      - SLUMNET_CHECKPOINT=checkpoints/best_model.pth

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./dataset:/app/dataset
      - ./outputs:/app/outputs
    depends_on:
      - api
